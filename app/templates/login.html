{% extends "base.html" %}
{% block titulo %}Entrar — Mail Center{% endblock %}
{% block conteudo %}
<div class="h-screen flex items-center justify-center bg-[#fbfbfa]">
  <form method="post" action="/login" class="w-full max-w-sm border border-cinza rounded-2xl bg-white p-8 shadow-sm">
    <div class="flex items-center gap-2 mb-6">
      <div class="w-9 h-9 rounded-lg bg-dourado flex items-center justify-center font-bold text-marinho">M</div>
      <span class="font-semibold text-lg text-marinho">Mail Center</span>
    </div>
    {% if erro %}
    <div class="mb-4 border border-red-300 bg-red-50 text-red-800 text-sm rounded-lg px-3 py-2">{{ erro }}</div>
    {% endif %}
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <label class="text-sm text-[#40444D]">Senha de acesso
      <input type="password" name="senha" autofocus required
             class="mt-1 w-full border border-cinza rounded-lg px-3 py-2 text-marinho">
    </label>
    <button class="mt-5 w-full bg-marinho text-white font-medium rounded-lg py-2 hover:brightness-125">Entrar</button>
  </form>
</div>
{% endblock %}
